name: kelopak_hub
description: "Bpedia Preview — app belanja Bpedia dengan 3 game hadiah Kelopak (clean-room preview)."
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.4
  url_launcher: ^6.3.3
  web: ^1.1.1
  daily_checkin:
    path: ../bpedia-daily-checkin
  roda_sabtu:
    path: ../bpedia-roda-sabtu
  misi_belanja:
    path: ../bpedia-misi-belanja

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-400.ttf
          weight: 400
        - asset: assets/fonts/Poppins-500.ttf
          weight: 500
        - asset: assets/fonts/Poppins-600.ttf
          weight: 600
        - asset: assets/fonts/Poppins-700.ttf
          weight: 700
        - asset: assets/fonts/Poppins-800.ttf
          weight: 800
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Italic-Variable.ttf
          style: italic

flutter_launcher_icons:
  image_path: assets/launcher/app_icon_preview_1024.png
  android: true
  ios: true
  adaptive_icon_foreground: assets/launcher/adaptive_fg_preview.png
  # The foreground art already sits inside the 66 dp safe zone of its 108 dp
  # canvas; 4% keeps it there at about the size of the legacy and web icons.
  adaptive_icon_foreground_inset: 4
  adaptive_icon_background: "#FDE7EC"
  remove_alpha_ios: true
  background_color_ios: "#FFF7F8"
  # Web icons are maintained by hand: web/favicon.png is the 32 px "B"
  # monogram (assets/launcher/favicon-32.png) and the maskable icons carry
  # the art inside the 40% safe zone. Generating would overwrite both.
  web:
    generate: false

flutter_native_splash:
  color: "#FFF7F8"
  image: assets/launcher/splash_logo_light.png
  color_dark: "#2A0A18"
  image_dark: assets/launcher/splash_logo_dark.png
  android_12:
    color: "#FFF7F8"
    image: assets/launcher/splash_android12_light.png
    color_dark: "#2A0A18"
    image_dark: assets/launcher/splash_android12_dark.png
  web: true
