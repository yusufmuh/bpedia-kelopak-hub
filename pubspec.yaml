name: kelopak_hub
description: "Sistem poin Kelopak Bpedia: mesin hadiah, hitung checkout, dan zona Hadiah dengan tiga game (Check-in Harian, Roda Sabtu, Misi Belanja)."
publish_to: 'none'
version: 3.0.0

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  daily_checkin:
    path: ../bpedia-daily-checkin
  roda_sabtu:
    path: ../bpedia-roda-sabtu
  misi_belanja:
    path: ../bpedia-misi-belanja

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/bipy/
    - assets/art/
    - assets/fx/
