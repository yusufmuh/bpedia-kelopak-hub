name: kelopak_hub
description: "Pusat Hub Aplikasi Bpedia Kelopak"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.5.5
  daily_checkin:
    path: ../bpedia-daily-checkin
  roda_sabtu:
    path: ../bpedia-roda-sabtu
  misi_belanja:
    path: ../bpedia-misi-belanja

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/studio/
