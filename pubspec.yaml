name: kelopak_hub
description: "Sistem poin Kelopak Bpedia: mesin hadiah, hitung checkout, dan zona Hadiah dengan tiga game (Check-in Harian, Roda Sabtu, Misi Belanja)."
publish_to: 'none'
version: 3.0.0

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  daily_checkin:
    git:
      url: https://github.com/yusufmuh/bpedia-daily-checkin.git
      ref: v3.0.0
  roda_sabtu:
    git:
      url: https://github.com/yusufmuh/bpedia-roda-sabtu.git
      ref: v3.0.0
  misi_belanja:
    git:
      url: https://github.com/yusufmuh/bpedia-misi-belanja.git
      ref: v3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/bipy/
    - assets/art/
    - assets/fx/
